# Pick My Ball – Astoria Regency (Local Supabase CLI Configuration)
project_id = "pick-my-ball-astoria-regency"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

# Public guest booking Edge Functions accept anon/publishable apikey without user login JWT.
# Admin Edge Functions (admin-*) retain JWT checks + verifyStaffJwt() staff_profiles RBAC.
[functions.availability]
verify_jwt = false

[functions.pricing-quote]
verify_jwt = false

[functions.guest-holds]
verify_jwt = false

[functions.booking-lookup]
verify_jwt = false

[functions.booking-cancel]
verify_jwt = false
